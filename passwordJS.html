<!DOCTYPE html>
<html>
<body>

<h2>Password Strength Checker</h2>

<input type="password" id="pass" placeholder="Enter password">
<button onclick="Abc()">Check Strength</button>

<h3 id="display"></h3>

<script>
let count = 0;

function Abc() {
    let pass = document.getElementById("pass").value;
    let score = 0;
    let msg = "";

    count++;

    // Length
    if (pass.length >= 6) {
        score += Math.floor(pass.length / 2) * 10;
    }

    // Uppercase
    if (/[A-Z]/.test(pass)) {
        score += 15;
    }

    // Lowercase
    if (/[a-z]/.test(pass)) {
        score += 15;
    }

    // Number
    if (/[0-9]/.test(pass)) {
        score += 20;
    }

    // Special character
    if (/[!@#$%^&*]/.test(pass)) {
        score += 25;
    }

    if (score > 100) {
        score = 100;
    }

    if (score >= 100) {
        msg = "Perfect Password! Success!";
    }
    else if (score >= 91) {
        msg = "Very Strong";
    }
    else if (score >= 71) {
        msg = "Strong";
    }
    else if (score >= 51) {
        msg = "Medium";
    }
    else if (score >= 31) {
        msg = "Weak";
    }
    else {
        msg = "Very Weak";
    }

    if (count > 8 && score < 71) {
        msg = "Need practice! Use uppercase, lowercase, numbers and special characters.";
    }

    document.getElementById("display").innerHTML =
        "Score: " + score +
        "<br>Strength: " + msg +
        "<br>Attempts: " + count;
}
</script>

</body>
</html>
