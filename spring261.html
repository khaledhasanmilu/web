<!DOCTYPE html>
<html>
<head>
    <title>Study Hours Tracker</title>
</head>
<body>

    <input type="text" id="course" placeholder="Course Name">
    <input type="number" id="hour" placeholder="Study Hour">

    <button id="add" onclick="Abc()">Add Course</button>

    <h1 id="disply"></h1>

    <script>
        let courses = [];
        let totalHours = 0;
        let count = 0;
        let msg = "";

        function Abc() {
            let course = document.getElementById("course").value;
            let hour = document.getElementById("hour").value;

            if (course == "" || hour == "" || Number(hour) <= 0) {
                alert("Enter valid input!");
                return;
            }

            count++;
            totalHours = totalHours + Number(hour);
            let avgHour = totalHours / count;

            courses.push(course);

            if (totalHours >= 20) {
                msg = "Weekly goal reached!";
            }
            else if (totalHours >= 13) {
                msg = "Almost ready!";
            }
            else if (totalHours >= 6) {
                msg = "Good progress!";
            }
            else {
                msg = "Start studying regularly!";
            }

            if (count > 7 && totalHours < 20) {
                msg = "Increase your study time!";
            }

            document.getElementById("disply").innerHTML =
                "Total: " + totalHours +
                " hours, Average: " + avgHour +
                " hours, Subjects: [" + courses +
                "], " + msg;
        }
    </script>

</body>
</html>
